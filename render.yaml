# Blueprint de Render: https://render.com/docs/blueprint-spec
# El servidor parte leyendo los resultados precalculados de cache/ (python -m dcsim.precompute).
services:
  - type: web
    name: aterriza
    runtime: python
    plan: standard            # 1 CPU, 2 GB (ID nuevo: 1c-2g). Siempre encendido; "free" se duerme tras 15 min
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn dcsim.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: DCSIM_WORKERS      # un proceso por CPU: Standard tiene 1
        value: "1"
      - key: DCSIM_N_CUSTOM     # futuros que corre "Tu regla"; bajar a 60 en el plan free
        value: "100"
